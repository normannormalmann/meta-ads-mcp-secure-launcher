<svg xmlns="http://www.w3.org/2000/svg" width="817" height="814" viewBox="0 0 817 814" role="img" aria-label="python setup_wizard.py">
<rect width="817" height="814" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 10a10 10 0 0 1 10-10h797a10 10 0 0 1 10 10v24H0z" fill="#161b22"/>
<circle cx="20" cy="17.0" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17.0" r="6" fill="#febc2e"/>
<circle cx="60" cy="17.0" r="6" fill="#28c840"/>
<text x="408.5" y="22.0" text-anchor="middle" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8b949e">python setup_wizard.py</text>
<text font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<tspan x="20" y="69"><tspan fill="#d2a8ff" font-weight="700">Step 6/7: Write guard limits</tspan></tspan>
<tspan x="20" y="89"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="109"><tspan fill="#c9d1d9">The write guard blocks budgets above these limits per campaign/ad set, as well as</tspan></tspan>
<tspan x="20" y="129"><tspan fill="#c9d1d9">deleting and archiving. Amounts are in your ad account currency. Optionally, ad links</tspan></tspan>
<tspan x="20" y="149"><tspan fill="#c9d1d9">can be restricted to your own domains.</tspan></tspan>
<tspan x="20" y="169"><tspan fill="#79c0ff">[?]  Maximum daily budget [250]: </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="189"><tspan fill="#79c0ff">[?]  Maximum lifetime budget / spend cap [5000]: </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="209"><tspan fill="#79c0ff">[?]  Allowed ad destination domains (comma-separated, empty = no restriction): </tspan><tspan fill="#ffffff" font-weight="700">example.com</tspan></tspan>
<tspan x="20" y="229"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="249"><tspan fill="#d2a8ff" font-weight="700">Step 7/7: Connect Claude Desktop</tspan></tspan>
<tspan x="20" y="269"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="289"><tspan fill="#c9d1d9">Claude Desktop configuration: C:\Users\you\AppData\Roaming\Claude\claude_desktop_config.json</tspan></tspan>
<tspan x="20" y="309"><tspan fill="#c9d1d9">This entry will be added as "meta-ads":</tspan></tspan>
<tspan x="20" y="329"><tspan fill="#a5d6ff">{</tspan></tspan>
<tspan x="20" y="349"><tspan fill="#a5d6ff">  "command": "C:\\Users\\you\\meta-ads-mcp-secure-launcher\\venv\\Scripts\\python.exe",</tspan></tspan>
<tspan x="20" y="369"><tspan fill="#a5d6ff">  "args": [</tspan></tspan>
<tspan x="20" y="389"><tspan fill="#a5d6ff">    "C:\\Users\\you\\meta-ads-mcp-secure-launcher\\launch_secure.py"</tspan></tspan>
<tspan x="20" y="409"><tspan fill="#a5d6ff">  ],</tspan></tspan>
<tspan x="20" y="429"><tspan fill="#a5d6ff">  "env": {</tspan></tspan>
<tspan x="20" y="449"><tspan fill="#a5d6ff">    "META_APP_ID": "123456789012345",</tspan></tspan>
<tspan x="20" y="469"><tspan fill="#a5d6ff">    "META_GUARD_MAX_DAILY_BUDGET": "250",</tspan></tspan>
<tspan x="20" y="489"><tspan fill="#a5d6ff">    "META_GUARD_MAX_LIFETIME_BUDGET": "5000",</tspan></tspan>
<tspan x="20" y="509"><tspan fill="#a5d6ff">    "META_GUARD_ALLOWED_URL_DOMAINS": "example.com"</tspan></tspan>
<tspan x="20" y="529"><tspan fill="#a5d6ff">  }</tspan></tspan>
<tspan x="20" y="549"><tspan fill="#a5d6ff">}</tspan></tspan>
<tspan x="20" y="569"><tspan fill="#79c0ff">[?]  Found existing entries with plain-text Meta credentials: meta-ads-mcp. Remove them</tspan></tspan>
<tspan x="20" y="589"><tspan fill="#79c0ff">     (recommended)? [Y/n] </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="609"><tspan fill="#79c0ff">[?]  Write the entry now? A backup is created first. [Y/n] </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="629"><tspan fill="#3fb950">[OK] Claude Desktop configuration updated.</tspan></tspan>
<tspan x="20" y="649"><tspan fill="#c9d1d9">Backup: C:\Users\you\AppData\Roaming\Claude\claude_desktop_config.json.bak-20261013-093000</tspan></tspan>
<tspan x="20" y="669"><tspan fill="#d29922">[!]  The backup still contains plain-text credentials. Delete it once everything works,</tspan></tspan>
<tspan x="20" y="689"><tspan fill="#c9d1d9">     and rotate the old token and app secret.</tspan></tspan>
<tspan x="20" y="709"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="729"><tspan fill="#c9d1d9">Done. Next steps:</tspan></tspan>
<tspan x="20" y="749"><tspan fill="#c9d1d9">  1. Quit Claude Desktop completely (tray icon -&gt; Quit) and start it again</tspan></tspan>
<tspan x="20" y="769"><tspan fill="#c9d1d9">  2. Settings -&gt; Connectors -&gt; meta-ads: set create_*/update_* tools to 'Always ask'</tspan></tspan>
<tspan x="20" y="789"><tspan fill="#c9d1d9">  3. Check the token regularly: venv\Scripts\python.exe check_token.py</tspan></tspan>
</text>
</svg>
