<circle cx="20" cy="17.0" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17.0" r="6" fill="#febc2e"/>
<circle cx="60" cy="17.0" r="6" fill="#28c840"/>
<text x="599.0" y="22.0" text-anchor="middle" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8b949e">python setup_wizard.py</text>
<text font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<tspan x="20" y="69"><tspan fill="#d2a8ff" font-weight="700">Schritt 3/7: Meta-App</tspan></tspan>
<tspan x="20" y="89"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="109"><tspan fill="#c9d1d9">Du brauchst eine Meta-App mit Marketing API. Die App-ID ist nicht geheim und wird in der</tspan></tspan>
<tspan x="20" y="129"><tspan fill="#c9d1d9">Claude-Desktop-Konfiguration gespeichert.</tspan></tspan>
<tspan x="20" y="149"><tspan fill="#c9d1d9">Zu finden unter https://developers.facebook.com/apps -&gt; deine App -&gt; App-Einstellungen -&gt; Allgemein.</tspan></tspan>
<tspan x="20" y="169"><tspan fill="#79c0ff">[?]  Meta App-ID: </tspan><tspan fill="#ffffff" font-weight="700">123456789012345</tspan></tspan>
<tspan x="20" y="189"><tspan fill="#79c0ff">[?]  Standard-Werbekonto (act_..., leer = keins; Claude braucht dann keine Konto-ID): </tspan><tspan fill="#ffffff" font-weight="700">act_1234567890</tspan></tspan>
<tspan x="20" y="209"><tspan fill="#79c0ff">[?]  Instagram-Reels-Tools einschalten (organische Reichweite, Aufrufe, ...)? Benötigt</tspan></tspan>
<tspan x="20" y="229"><tspan fill="#79c0ff">     das Recht instagram_manage_insights. [j/N] </tspan><tspan fill="#ffffff" font-weight="700">j</tspan></tspan>
<tspan x="20" y="249"><tspan fill="#79c0ff">[?]  Standard-Instagram-User-ID (Ziffern, leer = keine): </tspan><tspan fill="#ffffff" font-weight="700">17841400000000000</tspan></tspan>
<tspan x="20" y="269"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="289"><tspan fill="#d2a8ff" font-weight="700">Schritt 4/7: Zugangsdaten hinterlegen</tspan></tspan>
<tspan x="20" y="309"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="329"><tspan fill="#c9d1d9">Empfohlen: ein Systemnutzer-Token aus den Meta-Unternehmenseinstellungen:</tspan></tspan>
<tspan x="20" y="349"><tspan fill="#c9d1d9">  1. business.facebook.com/settings -&gt; Nutzer -&gt; Systemnutzer -&gt; Hinzufügen</tspan></tspan>
<tspan x="20" y="369"><tspan fill="#c9d1d9">  2. Nur die Werbekonten (und Seiten) zuweisen, die Claude verwalten soll</tspan></tspan>
<tspan x="20" y="389"><tspan fill="#c9d1d9">  3. Token für deine App erzeugen mit: ads_management, ads_read (+ business_management,</tspan></tspan>
<tspan x="20" y="409"><tspan fill="#c9d1d9">     pages_show_list, pages_read_engagement, pages_manage_ads, instagram_basic bei Bedarf;</tspan></tspan>
<tspan x="20" y="429"><tspan fill="#c9d1d9">     instagram_manage_insights für die Reels-Tools)</tspan></tspan>
<tspan x="20" y="449"><tspan fill="#c9d1d9">  4. Token und App-Secret kopieren (App-Einstellungen -&gt; Allgemein -&gt; App-Secret)</tspan></tspan>
<tspan x="20" y="469"><tspan fill="#c9d1d9">meta-ads-mcp/app_secret: fehlt</tspan></tspan>
<tspan x="20" y="489"><tspan fill="#c9d1d9">meta-ads-mcp/access_token: fehlt</tspan></tspan>
<tspan x="20" y="509"><tspan fill="#79c0ff">[?]  App-Secret und Token jetzt hinterlegen? Die Eingabe ist unsichtbar. [J/n] </tspan><tspan fill="#ffffff" font-weight="700">j</tspan></tspan>
<tspan x="20" y="529"><tspan fill="#c9d1d9">Meta App-Secret (Eingabe unsichtbar, Einfügen mit Rechtsklick): </tspan></tspan>
<tspan x="20" y="549"><tspan fill="#c9d1d9">  OK: 32 Zeichen erhalten, endet auf ...9f3a</tspan></tspan>
<tspan x="20" y="569"><tspan fill="#c9d1d9">Gespeichert: meta-ads-mcp/app_secret</tspan></tspan>
<tspan x="20" y="589"><tspan fill="#c9d1d9">Meta Access-Token (Eingabe unsichtbar, Einfügen mit Rechtsklick): </tspan></tspan>
<tspan x="20" y="609"><tspan fill="#c9d1d9">  OK: 239 Zeichen erhalten, endet auf ...Xk2Q</tspan></tspan>
<tspan x="20" y="629"><tspan fill="#c9d1d9">Gespeichert: meta-ads-mcp/access_token</tspan></tspan>
<tspan x="20" y="649"><tspan fill="#3fb950">[OK] Zugangsdaten im Windows-Anmeldeinformationsspeicher gespeichert.</tspan></tspan>
<tspan x="20" y="669"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="689"><tspan fill="#d2a8ff" font-weight="700">Schritt 5/7: Token prüfen</tspan></tspan>
<tspan x="20" y="709"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="729"><tspan fill="#c9d1d9">Frage Meta nach dem gespeicherten Token (der Token selbst wird nie angezeigt) ...</tspan></tspan>
<tspan x="20" y="749"><tspan fill="#c9d1d9">Gültig: ja</tspan></tspan>
<tspan x="20" y="769"><tspan fill="#c9d1d9">Typ: SYSTEM_USER, App: My Ads App</tspan></tspan>
<tspan x="20" y="789"><tspan fill="#c9d1d9">Ablauf: 2026-12-11 (in 59 Tagen)</tspan></tspan>
<tspan x="20" y="809"><tspan fill="#c9d1d9">Datenzugriff: läuft nie ab</tspan></tspan>
<tspan x="20" y="829"><tspan fill="#c9d1d9">Rechte: ads_management, ads_read, business_management, instagram_basic, instagram_manage_insights, pages_read_engagement, pages_show_list</tspan></tspan>
<tspan x="20" y="849"><tspan fill="#3fb950">[OK] Token ist gültig.</tspan></tspan>
</text>
</svg>
