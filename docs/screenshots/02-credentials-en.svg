<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="874" viewBox="0 0 1240 874" role="img" aria-label="python setup_wizard.py">
<rect width="1240" height="874" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 10a10 10 0 0 1 10-10h1220a10 10 0 0 1 10 10v24H0z" fill="#161b22"/>
<circle cx="20" cy="17.0" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17.0" r="6" fill="#febc2e"/>
<circle cx="60" cy="17.0" r="6" fill="#28c840"/>
<text x="620.0" y="22.0" text-anchor="middle" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8b949e">python setup_wizard.py</text>
<text font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<tspan x="20" y="69"><tspan fill="#d2a8ff" font-weight="700">Step 3/7: Meta app</tspan></tspan>
<tspan x="20" y="89"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="109"><tspan fill="#c9d1d9">You need a Meta app with the Marketing API. The App ID is not secret and is stored in</tspan></tspan>
<tspan x="20" y="129"><tspan fill="#c9d1d9">the Claude Desktop configuration.</tspan></tspan>
<tspan x="20" y="149"><tspan fill="#c9d1d9">Find it at https://developers.facebook.com/apps -&gt; your app -&gt; App settings -&gt; Basic.</tspan></tspan>
<tspan x="20" y="169"><tspan fill="#79c0ff">[?]  Meta App ID: </tspan><tspan fill="#ffffff" font-weight="700">123456789012345</tspan></tspan>
<tspan x="20" y="189"><tspan fill="#79c0ff">[?]  Default ad account (act_..., empty = none; Claude then needs no account ID): </tspan><tspan fill="#ffffff" font-weight="700">act_1234567890</tspan></tspan>
<tspan x="20" y="209"><tspan fill="#79c0ff">[?]  Enable the Instagram Reels tools (organic reach, views, ...)? Needs the scope</tspan></tspan>
<tspan x="20" y="229"><tspan fill="#79c0ff">     instagram_manage_insights. [y/N] </tspan><tspan fill="#ffffff" font-weight="700">y</tspan></tspan>
<tspan x="20" y="249"><tspan fill="#79c0ff">[?]  Default Instagram user ID (numeric, empty = none): </tspan><tspan fill="#ffffff" font-weight="700">17841400000000000</tspan></tspan>
<tspan x="20" y="269"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="289"><tspan fill="#d2a8ff" font-weight="700">Step 4/7: Store credentials</tspan></tspan>
<tspan x="20" y="309"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="329"><tspan fill="#c9d1d9">Recommended: a system user token from Meta Business Settings:</tspan></tspan>
<tspan x="20" y="349"><tspan fill="#c9d1d9">  1. business.facebook.com/settings -&gt; Users -&gt; System users -&gt; Add</tspan></tspan>
<tspan x="20" y="369"><tspan fill="#c9d1d9">  2. Assign only the ad accounts (and pages) Claude should manage</tspan></tspan>
<tspan x="20" y="389"><tspan fill="#c9d1d9">  3. Generate token for your app with: ads_management, ads_read (+ business_management,</tspan></tspan>
<tspan x="20" y="409"><tspan fill="#c9d1d9">     pages_show_list, pages_read_engagement, pages_manage_ads, instagram_basic if needed;</tspan></tspan>
<tspan x="20" y="429"><tspan fill="#c9d1d9">     instagram_manage_insights for the Reels tools)</tspan></tspan>
<tspan x="20" y="449"><tspan fill="#c9d1d9">  4. Copy the token and the app secret (App settings -&gt; Basic -&gt; App secret)</tspan></tspan>
<tspan x="20" y="469"><tspan fill="#c9d1d9">meta-ads-mcp/app_secret: missing</tspan></tspan>
<tspan x="20" y="489"><tspan fill="#c9d1d9">meta-ads-mcp/access_token: missing</tspan></tspan>
<tspan x="20" y="509"><tspan fill="#79c0ff">[?]  Store app secret and token now? Input is hidden. [Y/n] </tspan><tspan fill="#ffffff" font-weight="700">y</tspan></tspan>
<tspan x="20" y="529"><tspan fill="#c9d1d9">Meta app secret (hidden input, paste with right-click): </tspan></tspan>
<tspan x="20" y="549"><tspan fill="#c9d1d9">  OK: 32 characters received, ending in ...9f3a</tspan></tspan>
<tspan x="20" y="569"><tspan fill="#c9d1d9">Saved: meta-ads-mcp/app_secret</tspan></tspan>
<tspan x="20" y="589"><tspan fill="#c9d1d9">Meta access token (hidden input, paste with right-click): </tspan></tspan>
<tspan x="20" y="609"><tspan fill="#c9d1d9">  OK: 239 characters received, ending in ...Xk2Q</tspan></tspan>
<tspan x="20" y="629"><tspan fill="#c9d1d9">Saved: meta-ads-mcp/access_token</tspan></tspan>
<tspan x="20" y="649"><tspan fill="#3fb950">[OK] Credentials stored in the Windows Credential Manager.</tspan></tspan>
<tspan x="20" y="669"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="689"><tspan fill="#d2a8ff" font-weight="700">Step 5/7: Check token</tspan></tspan>
<tspan x="20" y="709"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="729"><tspan fill="#c9d1d9">Asking Meta about the stored token (the token itself is never shown) ...</tspan></tspan>
<tspan x="20" y="749"><tspan fill="#c9d1d9">Valid: yes</tspan></tspan>
<tspan x="20" y="769"><tspan fill="#c9d1d9">Type: SYSTEM_USER, app: My Ads App</tspan></tspan>
<tspan x="20" y="789"><tspan fill="#c9d1d9">Expiry: 2026-12-11 (in 59 days)</tspan></tspan>
<tspan x="20" y="809"><tspan fill="#c9d1d9">Data access: never expires</tspan></tspan>
<tspan x="20" y="829"><tspan fill="#c9d1d9">Permissions: ads_management, ads_read, business_management, instagram_basic, instagram_manage_insights, pages_read_engagement, pages_show_list</tspan></tspan>
<tspan x="20" y="849"><tspan fill="#3fb950">[OK] Token is valid.</tspan></tspan>
</text>
</svg>
