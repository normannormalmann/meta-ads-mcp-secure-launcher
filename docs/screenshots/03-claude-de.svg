<tspan x="20" y="649"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="669"><tspan fill="#c9d1d9">Fertig. Nächste Schritte:</tspan></tspan>
<tspan x="20" y="689"><tspan fill="#c9d1d9">  1. Claude Desktop komplett beenden (Tray-Symbol -&gt; Beenden) und neu starten</tspan></tspan>
