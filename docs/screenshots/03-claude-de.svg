<tspan x="20" y="69"><tspan fill="#d2a8ff" font-weight="700">Schritt 6/7: Grenzen für Schreibzugriffe</tspan></tspan>
<tspan x="20" y="89"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="109"><tspan fill="#c9d1d9">Der Schreibschutz blockiert Budgets über diesen Grenzen pro Kampagne/Anzeigengruppe</tspan></tspan>
<tspan x="20" y="129"><tspan fill="#c9d1d9">sowie Löschen und Archivieren. Beträge in der Währung deines Werbekontos.</tspan></tspan>
<tspan x="20" y="149"><tspan fill="#79c0ff">[?]  Maximales Tagesbudget [250]: </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="169"><tspan fill="#79c0ff">[?]  Maximales Laufzeitbudget / Ausgabenlimit [5000]: </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="189"><tspan fill="#c9d1d9"></tspan></tspan>
<tspan x="20" y="209"><tspan fill="#d2a8ff" font-weight="700">Schritt 7/7: Claude Desktop verbinden</tspan></tspan>
<tspan x="20" y="229"><tspan fill="#484f58">----------------------------------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="249"><tspan fill="#c9d1d9">Claude-Desktop-Konfiguration: C:\Users\you\AppData\Roaming\Claude\claude_desktop_config.json</tspan></tspan>
<tspan x="20" y="269"><tspan fill="#c9d1d9">Dieser Eintrag wird als "meta-ads" hinzugefügt:</tspan></tspan>
<tspan x="20" y="289"><tspan fill="#a5d6ff">{</tspan></tspan>
<tspan x="20" y="309"><tspan fill="#a5d6ff">  "command": "C:\\Users\\you\\meta-ads-mcp-secure-launcher\\venv\\Scripts\\python.exe",</tspan></tspan>
<tspan x="20" y="329"><tspan fill="#a5d6ff">  "args": [</tspan></tspan>
<tspan x="20" y="349"><tspan fill="#a5d6ff">    "C:\\Users\\you\\meta-ads-mcp-secure-launcher\\launch_secure.py"</tspan></tspan>
<tspan x="20" y="369"><tspan fill="#a5d6ff">  ],</tspan></tspan>
<tspan x="20" y="389"><tspan fill="#a5d6ff">  "env": {</tspan></tspan>
<tspan x="20" y="409"><tspan fill="#a5d6ff">    "META_APP_ID": "123456789012345",</tspan></tspan>
<tspan x="20" y="429"><tspan fill="#a5d6ff">    "META_GUARD_MAX_DAILY_BUDGET": "250",</tspan></tspan>
<tspan x="20" y="449"><tspan fill="#a5d6ff">    "META_GUARD_MAX_LIFETIME_BUDGET": "5000"</tspan></tspan>
<tspan x="20" y="469"><tspan fill="#a5d6ff">  }</tspan></tspan>
<tspan x="20" y="489"><tspan fill="#a5d6ff">}</tspan></tspan>
<tspan x="20" y="509"><tspan fill="#79c0ff">[?]  Vorhandene Einträge mit Meta-Zugangsdaten im Klartext gefunden: meta-ads-mcp.</tspan></tspan>
<tspan x="20" y="529"><tspan fill="#79c0ff">     Entfernen (empfohlen)? [J/n] </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="549"><tspan fill="#79c0ff">[?]  Eintrag jetzt schreiben? Vorher wird eine Sicherung angelegt. [J/n] </tspan><tspan fill="#ffffff" font-weight="700"></tspan></tspan>
<tspan x="20" y="569"><tspan fill="#3fb950">[OK] Claude-Desktop-Konfiguration aktualisiert.</tspan></tspan>
<tspan x="20" y="589"><tspan fill="#c9d1d9">Sicherung: C:\Users\you\AppData\Roaming\Claude\claude_desktop_config.json.bak-20261013-093000</tspan></tspan>
<tspan x="20" y="609"><tspan fill="#d29922">[!]  Die Sicherung enthält noch Zugangsdaten im Klartext. Lösche sie, sobald alles</tspan></tspan>
